<title>丙級水準 VR 練習</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bcd4e6;font-family:system-ui,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#2b2a27}
  :root{--blue:#1f5fa8;--green:#2f7d32;--amber:#a86a00;--red:#c0281e;--ink:#2b2a27;--muted:#6b6860;--line:#d5d1c6;--card:#fffffff2}
  #ui button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid #9a968c;background:#fff;color:var(--ink);padding:8px 14px;touch-action:none;user-select:none}
  #ui button:hover{filter:brightness(.96)}
  #ui button.pri{background:var(--blue);border-color:var(--blue);color:#fff}

  .hide{display:none!important}
  /* 上方列 */
  #top{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#ffffffe8;box-shadow:0 1px 4px #0002;font-size:15px;z-index:5}
  #top .sp{flex:1}
  #prog{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;overflow:hidden}
  #prog span{padding:4px 10px;border-radius:999px;color:#9a968c;white-space:nowrap;font-size:14px}

  #xr{border:0!important;background:var(--blue)!important;color:#fff!important}

  /* 主選單 */

  /* 步驟卡 */
  #card{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));box-sizing:border-box;background:var(--card);border-radius:16px;box-shadow:0 4px 20px #0003;padding:18px 22px;font-size:16px;line-height:1.55;z-index:4}
  #card h2{margin:0;font-size:24px;color:var(--ink)}
  #card .sub{margin:4px 0 0;color:var(--muted);font-size:16px}
  #card .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  #card .row.end{justify-content:flex-end}
  #card .status{margin-top:10px;font-weight:600;font-size:17px}
  #card .ok{color:var(--green)} #card .warn{color:var(--amber)} #card .bad{color:var(--red)}
  #card .howto{margin-top:10px;background:#f4f2ec;border-radius:10px;padding:8px 12px;font-size:15px}
  #card .inp{width:200px;height:44px;box-sizing:border-box;border:2px solid var(--blue);border-radius:10px;padding:0 12px;font:inherit;font-size:24px;font-variant-numeric:tabular-nums;background:#fff;color:#111;outline:none}
  #card .inp::placeholder{color:#aaa;font-size:16px}
  #card .inp:focus{box-shadow:0 0 0 3px #1f5fa833}
  #card .formula{margin-top:12px;background:#eef3fa;border-radius:10px;padding:10px 14px;font-size:20px;font-variant-numeric:tabular-nums}
  #card .formula small{display:block;font-size:14px;color:var(--muted)}
  #card .chips span{display:inline-block;background:#f4f2ec;border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-size:15px}
  #card .hint{margin-top:8px;color:#8a5a00;font-size:15px}
  #card .lvl{display:flex;gap:16px;align-items:center;margin-top:10px}
  #bubHost canvas{width:120px;height:120px;border-radius:12px;display:block}
  .screws{display:flex;gap:10px}
  .screws .g{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}

  .screws button.hot{animation:pulse 1s infinite;box-shadow:0 0 0 4px #ff8a1c88}
  @keyframes pulse{50%{box-shadow:0 0 0 8px #ff8a1c33}}
  #card svg{width:100%;height:auto;margin-top:8px}
  #card table.score{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
  #card table.score td{padding:4px 6px;border-bottom:1px solid #eee}
  #card .gloss{margin-top:10px;max-height:28vh;overflow:auto;font-size:15px}
  #card .gloss div{padding:3px 0;border-bottom:1px dashed #e4e0d6}
  #card .gloss b{display:inline-block;min-width:6.5em;color:var(--blue)}
  /* 望遠鏡 */
  #tel{position:fixed;right:24px;top:72px;width:min(calc(100vh - 150px),calc(100vw - 700px),560px);min-width:220px;aspect-ratio:1;z-index:3;pointer-events:none}
  #tel.big{width:min(calc(100vh - 130px),720px);right:50%;transform:translateX(50%);z-index:6}

  #telRing{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 6px #1b1b1b,0 4px 18px #0006}
  #telCap{position:absolute;left:0;right:0;top:calc(100% + 10px);display:flex;gap:6px;justify-content:center;align-items:center;pointer-events:auto;font-size:14px;color:var(--ink)}
  #telCap span{background:#ffffffdd;border-radius:8px;padding:3px 8px}
  #telCap button{padding:4px 10px!important;font-size:14px}
  /* 記錄表 */
  #book{position:fixed;left:16px;top:68px;background:var(--card);border-radius:14px;box-shadow:0 2px 12px #0002;padding:10px 12px;font-size:14px;z-index:3;max-width:calc(100vw - 32px);box-sizing:border-box}
  #book .bh{display:flex;align-items:center;gap:8px;font-weight:600}

  #book th,#book td{border:1px solid var(--line);padding:3px 8px;text-align:center;min-width:58px}
  #book th{background:#efece4;font-weight:500}

  /* 其他 */
  #toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#2f7d32;color:#fff;border-radius:12px;padding:10px 18px;font-size:16px;box-shadow:0 4px 14px #0003;z-index:6;max-width:calc(100vw - 32px);text-align:center}
  #toast b{color:#fff3b0}
  #home{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:5;font-size:16px}
  #help{position:fixed;right:12px;top:60px;width:min(340px,calc(100vw - 24px));background:#fff;border-radius:12px;box-shadow:0 4px 16px #0003;padding:12px 16px;font-size:14px;line-height:1.8;z-index:7}
  #help kbd{display:inline-block;min-width:1.3em;padding:0 4px;border:1px solid #bbb;border-bottom-width:2px;border-radius:4px;background:#f6f6f6;font-family:inherit;font-size:12px;text-align:center}
  @media (max-width:980px){#tel{width:min(42vw,42vh)!important;min-width:0}#card.side{width:calc(100vw - 32px)}#prog span:not(.on){display:none}}
</style>

<div id="ui">
  <div id="top">
    <button class="ghost" id="tMenu">☰ 選單</button>

  </div>
  <div id="menu"><div class="box">
    <h1>水準測量入門練習</h1>

    <button class="mode m2" id="mFull"><b>完整練習・約 20 分鐘</b><small>4 站全部自己做，流程和考試一樣，有提示</small></button>

    <b>電腦操作</b><br>
    滑鼠拖曳畫面：看四周　滾輪：拉近拉遠<br>
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>：走動（<kbd>Shift</kbd> 跑步）<br>
    卡片上的按鈕：點一下動一點，按住會一直動<br>
    輸入數字：直接用鍵盤打，按 <kbd>Enter</kbd> 確認<br>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ═════════════ 基本場景 ═════════════
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
const MAXANI = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd4e6);
scene.fog = new THREE.Fog(0xbcd4e6, 150, 450);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6b7a50, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(40, 80, 30); scene.add(sun);

const UI = 5;                 // 只給玩家眼睛看的圖層（望遠鏡看不到）
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.02, 800);
camera.layers.enable(UI);
camera.rotation.order = 'YXZ';
const rig = new THREE.Group(); scene.add(rig); rig.add(camera); camera.position.set(0, 1.6, 0);
const stationUI = new THREE.Group(); scene.add(stationUI);   // 測站旁的面板（固定在地上）
const instUI = new THREE.Group(); scene.add(instUI);         // 儀器台：釘在儀器上、轉向面對你（望遠鏡畫面、氣泡、操作面板）

const V3 = THREE.Vector3, UP = new V3(0, 1, 0);
const rnd = (a, b) => a + Math.random() * (b - a);
const r3 = v => Math.round(v * 1000) / 1000;
const FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC","Noto Sans CJK TC",sans-serif';
const DEG = Math.PI / 180, MIN = DEG / 60;
function setLayer(o, l) { o.traverse(c => c.layers.set(l)); }
function at(o, x, y, z) { o.position.set(x, y, z); return o; }

let MODE = 'menu';            // 'menu' | 'practice' | 'exam'
const practiceOnly = [];      // 練習模式才顯示的 3D 物件

// ═════════════ 題目資料 ═════════════
// 丙級術科第二部分：直接水準測量。已知 C（HC = 30.000 m），C → TP1 → D 往測、D → TP2 → C 返測，共 4 站
// 場地座標：y = 高程 − 30（C 樁頂在 y = 0）
const NAMES = ['C', 'TP1', 'D', 'TP2'];
const HC = 30.000;
const PT = [{ x: 0, z: 0 }, { x: 40, z: -4 }, { x: 80, z: 0 }, { x: 40, z: 4 }];   // TP1、TP2 分開放（規定不能放同一位置）
const ST_DEF = [
  { name: 'L1', x: 20, z: -3.5, pts: [0, 1] }, { name: 'L2', x: 60, z: -3.5, pts: [1, 2] },
  { name: 'L3', x: 60, z: 3.5, pts: [2, 3] }, { name: 'L4', x: 20, z: 3.5, pts: [3, 0] }];
const GX = [-200, 0, 20, 40, 60, 80, 300];
let D;
function interpG(g, x) {
  if (x <= GX[0]) return g[0];
  for (let i = 1; i < GX.length; i++) if (x <= GX[i]) { const t = (x - GX[i - 1]) / (GX[i] - GX[i - 1]); return g[i - 1] + (g[i] - g[i - 1]) * t; }
  return g[g.length - 1];
}
// official = true：讀數與試題範例相同（C後 2.000、TP1前 1.700、TP1後 1.600、D前 1.100、D後 1.220、TP2前 1.714、TP2後 1.520、C前 1.832）
// official = false：隨機出題（實戰模式），每個讀數另加 ±1.5 mm 的觀測誤差
function genData(official) {
  for (;;) {
    let g, tops, HI, off = [0, 1, 2, 3].map(() => [0, 0, 0, 0]);
    if (official) {
      g = [-0.02, -0.02, 0.45, 0.27, 0.50, 0.78, 0.78];
      tops = [0, 0.300, 0.800, 0.306];
      HI = [2.000, 1.900, 2.020, 1.826];
      off[3][0] = -0.006;                       // L4 讀 C 時的觀測誤差 → 閉合差 W = 6 mm（同範例）
    } else {
      const g40 = rnd(-0.5, 0.5), g80 = g40 + rnd(-0.5, 0.5);
      g = [-0.02, -0.02, (g40 - 0.02) / 2 + rnd(-0.15, 0.15), g40, (g40 + g80) / 2 + rnd(-0.15, 0.15), g80, g80];
      tops = [0, g40 + 0.03, g80 + 0.02, g40 + 0.03 + rnd(-0.01, 0.01)];
      HI = ST_DEF.map(s => interpG(g, s.x) + rnd(1.35, 1.55));
      off = off.map(row => row.map(() => Math.round(rnd(-3, 3)) / 2000));
    }
    const st = ST_DEF.map((s, i) => { const gy = interpG(g, s.x); return { ...s, gy, ih: HI[i] - gy }; });
    if (!official && st.some((s, i) => s.pts.some(p => { const r = HI[i] - tops[p]; return r < 0.5 || r > 2.8; }))) continue;
    return { g, tops, st, off, HDtrue: r3(HC + tops[2]) };
  }
}
D = genData(true);
const groundAt = x => interpG(D.g, x);
function trueRead(si, pi) {
  const s = D.st[si];
  const dist = Math.hypot(PT[pi].x - s.x, PT[pi].z - s.z);
  const mid = s.gy + s.ih - (D.tops[pi] + D.off[si][pi]);
  return { mid, up: mid + dist / 200, low: mid - dist / 200, dist };
}

// ═════════════ 地面、道路、樹 ═════════════
const world = new THREE.Group(); scene.add(world);
let groundMesh, pathMesh;
function buildGround() {
  if (groundMesh) { world.remove(groundMesh, pathMesh); groundMesh.geometry.dispose(); pathMesh.geometry.dispose(); }
  const geo = new THREE.PlaneGeometry(700, 500, 350, 10); geo.rotateX(-Math.PI / 2); geo.translate(60, 0, 0);
  const p = geo.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) {
    p.setY(i, groundAt(p.getX(i)) - 0.002);
    const k = 0.82 + Math.random() * 0.18; col.push(0.40 * k, 0.58 * k, 0.27 * k);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); geo.computeVertexNormals();
  groundMesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  const pg = new THREE.PlaneGeometry(110, 14, 55, 1); pg.rotateX(-Math.PI / 2); pg.translate(40, 0, 0);   // 碎石場地（測線範圍）
  const pp = pg.attributes.position; for (let i = 0; i < pp.count; i++) pp.setY(i, groundAt(pp.getX(i)) + 0.004);
  pg.computeVertexNormals();
  pathMesh = new THREE.Mesh(pg, new THREE.MeshLambertMaterial({ color: 0xb9a57a }));
  world.add(groundMesh, pathMesh);
}
buildGround();
{
  const trunkM = new THREE.MeshLambertMaterial({ color: 0x6b4a2b }), leafM = new THREE.MeshLambertMaterial({ color: 0x3d6b2f });
  for (let i = 0; i < 40; i++) {
    const x = rnd(-80, 200), z = (Math.random() < 0.5 ? -1 : 1) * rnd(12, 90), h = rnd(4, 9);
    world.add(at(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.22, h * 0.4, 6), trunkM), x, h * 0.2, z));
    world.add(at(new THREE.Mesh(new THREE.ConeGeometry(h * 0.28, h * 0.7, 8), leafM), x, h * 0.62, z));
  }
  const bM = new THREE.MeshLambertMaterial({ color: 0xd9d2c3 });
  for (const [x, z, w, h] of [[-40, -70, 18, 8], [150, -80, 24, 11], [60, 110, 30, 7]])
    world.add(at(new THREE.Mesh(new THREE.BoxGeometry(w, h, 10), bM), x, h / 2, z));
}

// ═════════════ 文字標籤（3D 浮動） ═════════════
function labelTex(text, color = '#1f5fa8', bg = '#ffffff') {
  const c = document.createElement('canvas'), x = c.getContext('2d'), fs = 52;
  x.font = `500 ${fs}px ${FONT}`;
  c.width = Math.ceil(x.measureText(text).width) + 44; c.height = fs + 30;
  x.font = `500 ${fs}px ${FONT}`;
  x.fillStyle = bg; x.strokeStyle = color; x.lineWidth = 5;
  x.beginPath(); x.roundRect(3, 3, c.width - 6, c.height - 6, 16); x.fill(); x.stroke();
  x.fillStyle = color; x.textBaseline = 'middle'; x.fillText(text, 22, c.height / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAXANI;
  return { t, aspect: c.width / c.height };
}
function makeSprite(text, h, color, bg) {
  const { t, aspect } = labelTex(text, color, bg);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
  s.scale.set(h * aspect, h, 1); s.renderOrder = 20; s.userData.aspect = aspect;
  return s;
}
// 部位標籤：只顯示「這一步用得到」的，避免互相重疊；大小隨距離自動調整
const labels = [];
let labelAll = false;
// anchor：零件上的點（parent 座標）；off：標籤要擺在「你看過去」的右/上多遠（公尺，0.65 m 距離時）
// 每幀依照你站的位置重新排，所以不管鏡頭轉到哪個方向，標籤都在固定的上下左右，不會互相疊在一起
function addLabel(key, parent, text, anchor, off, color = '#1f5fa8') {
  const g = new THREE.Group();
  const s = makeSprite(text, 0.03, color);
  const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new V3(), new V3()]), new THREE.LineBasicMaterial({ color, depthTest: false }));
  ln.renderOrder = 19; ln.frustumCulled = false;
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.004, 8, 6), new THREE.MeshBasicMaterial({ color, depthTest: false }));
  dot.renderOrder = 19;
  g.add(ln, s, dot); scene.add(g); setLayer(g, UI); g.visible = false;
  const L = { key, g, s, ln, dot, parent, anchor, off };
  labels.push(L);
  return L;
}

// ═════════════ 水準尺（5 mm 式，自繪） ═════════════
function staffCanvas(m) {
  // 仿考場用的 5 mm 刻劃尺（同老師網站「水準尺讀數5mm」教具樣式）：
  // 右側每公分一個小數字（149 = 1.49 m）；左欄每公分上半 5 mm 黑塊、右欄奇數公分整格黑，組成 E 字形；

// ═════════════ 2D 面板工具 ═════════════
class Panel {
  constructor(w, h, pw, ph) {
    this.c = document.createElement('canvas'); this.c.width = pw; this.c.height = ph; this.x = this.c.getContext('2d');
    this.tex = new THREE.CanvasTexture(this.c); this.tex.colorSpace = THREE.SRGBColorSpace; this.tex.anisotropy = MAXANI;
    this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: this.tex }));
    this.mesh.userData.panel = this; this.regions = [];
  }
  find(uv) {
    const px = uv.x * this.c.width, py = (1 - uv.y) * this.c.height;
    for (const r of this.regions) if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return r;
    return null;
  }
  bg(col = '#fbfaf6') { this.regions = []; this.x.fillStyle = col; this.x.fillRect(0, 0, this.c.width, this.c.height); }
  rect(x0, y0, w, h, fill, stroke, lw = 2) { const x = this.x; x.beginPath(); x.roundRect(x0, y0, w, h, 12); if (fill) { x.fillStyle = fill; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw; x.stroke(); } }
  text(t, x0, y0, size = 26, color = '#2b2a27', align = 'left', weight = '') {
    const x = this.x; x.font = `${weight} ${size}px ${FONT}`; x.fillStyle = color; x.textAlign = align; x.textBaseline = 'middle'; x.fillText(t, x0, y0);
  }
  wrap(t, x0, y0, maxW, size = 28, color = '#2b2a27', lh = 1.5, weight = '') {      // 中文逐字換行，回傳下一行 y
    const x = this.x; x.font = `${weight} ${size}px ${FONT}`; x.fillStyle = color; x.textAlign = 'left'; x.textBaseline = 'middle';
    let line = '';
    for (const ch of t) {
      if (x.measureText(line + ch).width > maxW && line) { x.fillText(line, x0, y0); y0 += size * lh; line = ch; }
      else line += ch;
    }
    if (line) { x.fillText(line, x0, y0); y0 += size * lh; }
    return y0;
  }
  btn(x0, y0, w, h, label, fn, { fill = '#ffffff', color = '#2b2a27', size = 30, stroke = '#9a968c', rep = false, lw = 2 } = {}) {
    this.rect(x0, y0, w, h, fill, stroke, lw); this.text(label, x0 + w / 2, y0 + h / 2 + 1, size, color, 'center', '500');
    this.regions.push({ x: x0, y: y0, w, h, fn, rep });
  }
  update() { this.tex.needsUpdate = true; }
}

function scoreAll(v, m) {
  const r = solve(v);
  if (!r) return { it: [['讀數沒有填完', 35, 0, '8 個讀數都要填，才能計算。']], ref: [], total: 0 };
  const it = [], ref = [];
  const eHD = isFinite(v.HD) ? Math.round(Math.abs(v.HD - D.HDtrue) * 1000) : null;
  const sHD = eHD == null ? 0 : eHD <= 5 ? 35 : eHD <= 10 ? 20 : 0;
  it.push(['D 點高程 HD', 35, sHD, eHD == null ? 'HD 沒有填。' : `你的 HD = ${v.HD.toFixed(3)}，正確值 ${D.HDtrue.toFixed(3)}，差 ${eHD} mm（±5 mm 內 35 分、6～10 mm 20 分、11 mm 以上 0 分）`]);
  const wmm = Math.round(r.W * 1000), dW = wmm <= 7 ? 0 : wmm <= 15 ? -5 : -10;
  it.push(['閉合差 W', 0, dW, `依你的讀數 W = ${wmm} mm（7 mm 內不扣、8～15 mm 扣 5 分、16 mm 以上扣 10 分）`]);
  const wOk = near(v.W, r.W);
  it.push(['答案紙上的 W', 0, wOk ? 0 : -10, wOk ? '和讀數算出來的一致。' : `依讀數應為 ${r.W.toFixed(3)}，答案紙${isFinite(v.W) ? '寫 ' + v.W.toFixed(3) : '沒有填'}，扣 10 分。`]);
  const total = Math.max(0, sHD + dW + (wOk ? 0 : -10));
  const bad = CALC_FULL.filter(k => !(isFinite(v[k]) && Math.abs(v[k] - r[k]) <= (k === 'hAvg' || k === 'HD' ? 0.0011 : 0.0005)));
  ref.push(['手簿計算（參考，不計入本題）', bad.length ? `有 ${bad.length} 格不對或沒填：${bad.map(KEY_NAME).join('、')}。完整試題的「手簿記錄」每錯一格扣 1 分。` : '9 格全部正確。']);
  if (m) {
    const badI = READS.filter(q => !(m[q.key] && !m[q.key].tilt && m[q.key].aim === q.pt && m[q.key].st === q.si));
    ref.push(['儀器操作（參考，不計入本題）', badI.length ? '這些讀數不是在「儀器水平、對準正確的尺、在正確的測站」時讀的：' + badI.map(q => KEY_NAME(q.key)).join('、') : '每個讀數都是在儀器水平、對準正確的尺時讀的。']);
  }
  return { it, ref, total };
}
